name: build
on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        run: git clone ${{ secrets.DOCKER_REPO }} .

      - run: ls -al

      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: "1.24"
          project_path: "."
          binary_name: "denv"
          pre_command: export CGO_ENABLED=0
          build_flags: "-buildvcs=false -trimpath"
          ldflags: "-s -w -X 'denv/cmd.AnalyticAPI=${{ secrets.ANALYTIC_API }}'"
          overwrite: true
